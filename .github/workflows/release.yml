name: Release

# Runs in the PUBLIC repository when a version tag arrives (or by hand for a
# tag): builds the download files (source tarball and SHA256SUMS) and the
# GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build the release for, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'rob-paprocki/claude-code-discord-bridge'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Tag must be exactly vX.Y.Z
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag name"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Build download files
        run: |
          VERSION="${TAG#v}"
          mkdir dist
          git archive --format=tar.gz --prefix="claude-code-discord-bridge-$VERSION/" \
              -o "dist/claude-code-discord-bridge-$VERSION.tar.gz" "$TAG"
          (cd dist && sha256sum "claude-code-discord-bridge-$VERSION.tar.gz" > SHA256SUMS && cat SHA256SUMS)
          python3 scripts/release/changelog.py notes "$VERSION" > notes.md
      - name: Create GitHub release (skip if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"; exit 0
          fi
          gh release create "$TAG" dist/* --title "claude-code-discord-bridge ${TAG#v}" --notes-file notes.md --verify-tag
