name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Worker tests and types
        run: cd worker && npm ci && npm test && npm run typecheck
      - name: Hook tests
        run: bash tests/hooks/run.sh
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Personal-value check (emails, IPs, MACs)
        run: python3 tests/check_repo.py

  python39:
    # Rob's Mac publishes with Apple's Python 3.9, so run the scripts' tests on 3.9 too.
    runs-on: ubuntu-latest
    container: python:3.9
    steps:
      - uses: actions/checkout@v4
      - name: Trust the workspace (the container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python3 --version
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Personal-value check (emails, IPs, MACs)
        run: python3 tests/check_repo.py

  changelog:
    # Only in the private development repo, and only on main: flag visible
    # changes that have no changelog line.
    if: github.repository == 'rob-paprocki/claude-code-discord-bridge-private' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changelog check
        run: python3 scripts/release/changelog_check.py
