<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Claude Code hooks on several machines send requests to a Cloudflare Worker with a Durable Object, which sends a Discord DM. Your button press goes back through the Worker, and the hook picks up the answer.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e6edf3"/></marker></defs>
<rect x="20" y="42" width="190" height="52" rx="8" fill="none" stroke="#e6edf3" stroke-width="1.6"/>
<text x="115" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Claude Code hooks</text>
<text x="115" y="82" text-anchor="middle" font-size="12" fill="#e6edf3">machine A</text><rect x="20" y="122" width="190" height="52" rx="8" fill="none" stroke="#e6edf3" stroke-width="1.6"/>
<text x="115" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Claude Code hooks</text>
<text x="115" y="162" text-anchor="middle" font-size="12" fill="#e6edf3">machine B</text><rect x="20" y="202" width="190" height="52" rx="8" fill="none" stroke="#e6edf3" stroke-width="1.6"/>
<text x="115" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Claude Code hooks</text>
<text x="115" y="242" text-anchor="middle" font-size="12" fill="#e6edf3">machine C</text><rect x="290" y="40" width="180" height="216" rx="8" fill="none" stroke="#e6edf3" stroke-width="1.6"/>
<text x="380" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Worker + Durable Object</text>
<text x="380" y="162" text-anchor="middle" font-size="12" fill="#e6edf3">your Cloudflare account</text><rect x="550" y="100" width="150" height="96" rx="8" fill="none" stroke="#e6edf3" stroke-width="1.6"/>
<text x="625" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Discord DM</text>
<text x="625" y="162" text-anchor="middle" font-size="12" fill="#e6edf3">on your phone</text><line x1="210" y1="58" x2="290" y2="58" stroke="#e6edf3" stroke-width="1.6"  marker-end="url(#a)"/><line x1="290" y1="78" x2="210" y2="78" stroke="#e6edf3" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><line x1="210" y1="138" x2="290" y2="138" stroke="#e6edf3" stroke-width="1.6"  marker-end="url(#a)"/><line x1="290" y1="158" x2="210" y2="158" stroke="#e6edf3" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><line x1="210" y1="218" x2="290" y2="218" stroke="#e6edf3" stroke-width="1.6"  marker-end="url(#a)"/><line x1="290" y1="238" x2="210" y2="238" stroke="#e6edf3" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><line x1="470" y1="138" x2="550" y2="138" stroke="#e6edf3" stroke-width="1.6"  marker-end="url(#a)"/><line x1="550" y1="158" x2="470" y2="158" stroke="#e6edf3" stroke-width="1.6"  marker-end="url(#a)"/><circle cx="510" cy="121" r="10" fill="none" stroke="#e6edf3" stroke-width="1.4"/><text x="510" y="125.5" text-anchor="middle" font-size="12" font-weight="600" fill="#e6edf3">2</text><circle cx="510" cy="177" r="10" fill="none" stroke="#e6edf3" stroke-width="1.4"/><text x="510" y="181.5" text-anchor="middle" font-size="12" font-weight="600" fill="#e6edf3">3</text><circle cx="250" cy="36" r="10" fill="none" stroke="#e6edf3" stroke-width="1.4"/><text x="250" y="40.5" text-anchor="middle" font-size="12" font-weight="600" fill="#e6edf3">1</text><circle cx="250" cy="260" r="10" fill="none" stroke="#e6edf3" stroke-width="1.4"/><text x="250" y="264.5" text-anchor="middle" font-size="12" font-weight="600" fill="#e6edf3">4</text><text x="20" y="296" font-size="13" fill="#e6edf3">1  A hook sends the prompt to the Worker.   2  The Worker sends you a DM with buttons.</text>
